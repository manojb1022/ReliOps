apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: default
  labels:
    app: postgres-backup
spec:
  # Run daily at 2 AM
  schedule: "0 2 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: postgres-backup
        spec:
          serviceAccountName: postgres-backup-sa
          restartPolicy: OnFailure
          containers:
          - name: backup
            image: postgres:15-alpine
            imagePullPolicy: IfNotPresent
            command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Starting backup at $(date)"
              
              # Create backup directory
              mkdir -p /backups
              
              # Generate backup filename
              BACKUP_FILE="/backups/reliops_db_$(date +%Y%m%d_%H%M%S).sql"
              
              # Perform backup
              PGPASSWORD=$DB_PASSWORD pg_dump \
                -h $DB_HOST \
                -U $DB_USER \
                -d $DB_NAME \
                -F c \
                -f "$BACKUP_FILE"
              
              # Verify backup
              if [ -f "$BACKUP_FILE" ]; then
                BACKUP_SIZE=$(du -h "$BACKUP_FILE" | cut -f1)
                echo "Backup completed successfully: $(basename $BACKUP_FILE) (Size: $BACKUP_SIZE)"
              else
                echo "ERROR: Backup file not created!"
                exit 1
              fi
              
              # Clean up old backups (keep last 7 days)
              echo "Cleaning up old backups..."
              find /backups -name "reliops_db_*.sql" -type f -mtime +7 -delete
              
              # List current backups
              echo "Current backups:"
              ls -lh /backups/reliops_db_*.sql 2>/dev/null || echo "No backups found"
              
              echo "Backup process completed at $(date)"
            env:
            - name: DB_HOST
              value: "postgres-postgresql"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "reliops_db"
            - name: DB_USER
              value: "reliops"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            volumeMounts:
            - name: backup-storage
              mountPath: /backups
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
          volumes:
          - name: backup-storage
            persistentVolumeClaim:
              claimName: postgres-backup-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backup-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-backup-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: postgres-backup-role
  namespace: default
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: postgres-backup-rolebinding
  namespace: default
subjects:
- kind: ServiceAccount
  name: postgres-backup-sa
  namespace: default
roleRef:
  kind: Role
  name: postgres-backup-role
  apiGroup: rbac.authorization.k8s.io
