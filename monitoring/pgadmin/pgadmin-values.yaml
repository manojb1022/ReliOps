# pgAdmin 4 Helm Chart Values for SRE Portfolio Project

# Environment variables
env:
  email: admin@reliops.com
  password: admin123

# Service configuration
service:
  type: NodePort
  nodePort: 30100
  port: 80

# Resource limits
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Persistence
persistentVolume:
  enabled: true
  size: 2Gi
  storageClass: "standard"

# Server definitions (pre-configured connections)
serverDefinitions:
  enabled: true
  servers:
    "1":
      Name: "ReliOps PostgreSQL"
      Group: "Servers"
      Host: "postgres-postgresql.default.svc.cluster.local"
      Port: 5432
      MaintenanceDB: "reliops_db"
      Username: "reliops"
      SSLMode: "prefer"
      Comment: "SRE Portfolio Database"

# Security context
securityContext:
  runAsUser: 5050
  runAsGroup: 5050
  fsGroup: 5050

# Ingress (disabled, using NodePort)
ingress:
  enabled: false
