# Grafana Loki Helm Chart Values for SRE Portfolio Project

loki:
  # Authentication
  auth_enabled: false
  
  # Common config
  commonConfig:
    replication_factor: 1
  
  # Storage config
  storage:
    type: 'filesystem'
    filesystem:
      chunks_directory: /tmp/loki/chunks
      rules_directory: /tmp/loki/rules
  
  # Schema config
  schemaConfig:
    configs:
      - from: 2024-01-01
        store: boltdb-shipper
        object_store: filesystem
        schema: v11
        index:
          prefix: index_
          period: 24h
  
  # Limits
  limits_config:
    retention_period: 168h  # 7 days
    ingestion_rate_mb: 10
    ingestion_burst_size_mb: 20

# Resource configuration
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Persistence
persistence:
  enabled: true
  size: 10Gi
  storageClass: "standard"

# Service
service:
  type: ClusterIP
  port: 3100

# Service Monitor for Prometheus
serviceMonitor:
  enabled: true
  interval: 30s

# Ingress (disabled)
ingress:
  enabled: false
