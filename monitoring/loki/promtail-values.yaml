# Promtail Helm Chart Values for SRE Portfolio Project

# Loki client configuration
config:
  lokiAddress: http://loki:3100/loki/api/v1/push
  
  # Scrape configs
  snippets:
    scrapeConfigs: |
      # Scrape logs from all pods
      - job_name: kubernetes-pods
        pipeline_stages:
          - cri: {}
          - json:
              expressions:
                timestamp: timestamp
                level: level
                message: message
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          # Add namespace label
          - source_labels: [__meta_kubernetes_pod_namespace]
            target_label: namespace
          # Add pod name label
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          # Add container name label
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          # Add app label
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            target_label: app
          # Drop empty containers
          - source_labels: [__meta_kubernetes_pod_container_name]
            regex: ^$
            action: drop
      
      # Scrape systemd logs
      - job_name: systemd-journal
        journal:
          path: /var/log/journal
          max_age: 12h
        relabel_configs:
          - source_labels: ['__journal__systemd_unit']
            target_label: 'unit'
          - source_labels: ['__journal__hostname']
            target_label: 'hostname'

# Resource configuration
resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

# Mount host logs
extraVolumes:
  - name: varlog
    hostPath:
      path: /var/log
  - name: varlibdockercontainers
    hostPath:
      path: /var/lib/docker/containers

extraVolumeMounts:
  - name: varlog
    mountPath: /var/log
    readOnly: true
  - name: varlibdockercontainers
    mountPath: /var/lib/docker/containers
    readOnly: true

# Run as DaemonSet
daemonset:
  enabled: true

# Service Monitor
serviceMonitor:
  enabled: true
  interval: 30s

# Security context
securityContext:
  privileged: true
  runAsUser: 0
