name: SRE Portfolio CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'blue'
        type: choice
        options:
        - blue
        - green

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Lint and Test Job
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pylint black pytest pytest-cov

      - name: Lint with pylint
        run: |
          pylint app/main.py --disable=C0114,C0116

      - name: Format check with black
        run: |
          black --check app/

      - name: Run tests
        run: |
          cd app
          pytest tests/ --cov=main --cov-report=xml --cov-report=html

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: app/coverage.xml
          flags: unittests
          name: codecov-umbrella

  # Security Scan Job
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Trivy image scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'hello-api:latest'
          format: 'sarif'
          output: 'trivy-image-results.sarif'

      - name: Upload Trivy image scan results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-image-results.sarif'

  # Build and Push Job
  build-push:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: [lint-test, security-scan]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy Job
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-push
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: ${{ github.event.inputs.environment || 'blue' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: '3.12.0'

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure kubectl for minikube
        run: |
          # This would be configured for your actual cluster
          # For demo purposes, we'll simulate the configuration
          echo "Configuring kubectl context..."

      - name: Deploy to Kubernetes
        run: |
          # Get the image tag from the build job
          IMAGE_TAG="${{ needs.build-push.outputs.image-tag }}"
          
          # Deploy using Helm
          helm upgrade --install hello-api-${{ github.event.inputs.environment || 'blue' }} \
            ./helm/hello-api \
            --namespace hello-api \
            --create-namespace \
            --set image.tag=${{ github.event.inputs.environment || 'blue' }} \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
            --values ./helm/hello-api/values-${{ github.event.inputs.environment || 'blue' }}.yaml \
            --wait \
            --timeout=5m

      - name: Verify deployment
        run: |
          kubectl get pods -n hello-api
          kubectl get services -n hello-api
          kubectl get ingress -n hello-api

  # Smoke Test Job
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure kubectl for minikube
        run: |
          echo "Configuring kubectl context..."

      - name: Wait for deployment to be ready
        run: |
          kubectl wait --for=condition=available deployment/hello-api-${{ github.event.inputs.environment || 'blue' }} -n hello-api --timeout=300s

      - name: Get service URL
        id: service-url
        run: |
          # Get the service URL (this would be the actual URL in a real deployment)
          echo "url=http://localhost:30000" >> $GITHUB_OUTPUT

      - name: Run smoke tests
        run: |
          # Wait for service to be ready
          sleep 30
          
          # Test health endpoint
          curl -f "${{ steps.service-url.outputs.url }}/health" || exit 1
          
          # Test ready endpoint
          curl -f "${{ steps.service-url.outputs.url }}/ready" || exit 1
          
          # Test metrics endpoint
          curl -f "${{ steps.service-url.outputs.url }}/metrics" || exit 1
          
          # Test main endpoint
          curl -f "${{ steps.service-url.outputs.url }}/" || exit 1
          
          echo "All smoke tests passed!"

  # Blue/Green Deployment Job
  blue-green-deploy:
    name: Blue/Green Deployment
    runs-on: ubuntu-latest
    needs: [build-push, smoke-test]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'green'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: '3.12.0'

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Deploy green environment
        run: |
          # Deploy green environment
          helm upgrade --install hello-api-green \
            ./helm/hello-api \
            --namespace hello-api \
            --create-namespace \
            --set image.tag=green \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
            --values ./helm/hello-api/values-green.yaml \
            --wait \
            --timeout=5m

      - name: Switch traffic to green
        run: |
          # This would involve updating the ingress or service selector
          # to point to the green environment
          echo "Switching traffic to green environment..."
          # kubectl patch service hello-api -n hello-api -p '{"spec":{"selector":{"version":"green"}}}'

      - name: Verify green deployment
        run: |
          kubectl get pods -n hello-api -l version=green
          kubectl get services -n hello-api

  # Cleanup Job
  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    needs: [deploy, smoke-test]
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Cleanup PR environment
        run: |
          echo "Cleaning up PR environment..."
          # kubectl delete namespace hello-api-pr-${{ github.event.number }} || true
