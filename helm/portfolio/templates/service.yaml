apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-portfolio
  labels:
    app: portfolio
    release: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
      protocol: TCP
      name: http
  selector:
    app: portfolio
    release: {{ .Release.Name }}

