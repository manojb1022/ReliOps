{{- if .Values.metrics.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-portfolio
  labels:
    app: portfolio
    release: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      app: portfolio
      release: {{ .Release.Name }}
  endpoints:
  - port: http
    path: {{ .Values.metrics.path }}
    interval: 30s
    scrapeTimeout: 10s
{{- end }}

