replicaCount: 2

image:
  repository: portfolio-app
  pullPolicy: IfNotPresent
  tag: "latest"

serviceAccount:
  create: true
  name: "portfolio"

service:
  type: NodePort
  port: 3000
  targetPort: 3000
  nodePort: 30100

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

livenessProbe:
  httpGet:
    path: /api/health
    port: 3000
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/ready
    port: 3000
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

metrics:
  enabled: true
  path: /api/metrics
  port: 3000

env:
  - name: NODE_ENV
    value: "production"
  - name: PORT
    value: "3000"

