# PostgreSQL Helm Chart Values for SRE Portfolio Project

global:
  postgresql:
    auth:
      username: reliops
      password: reliops123
      database: reliops_db
      postgresPassword: postgres123

primary:
  # Resource configuration
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  
  # Persistence configuration
  persistence:
    enabled: true
    size: 5Gi
    storageClass: "standard"
  
  # PostgreSQL configuration
  pgHbaConfiguration: |-
    local all all trust
    host all all 127.0.0.1/32 trust
    host all all ::1/128 trust
    host all all 0.0.0.0/0 md5
  
  # Enable metrics
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi
  
  # PostgreSQL settings
  extendedConfiguration: |-
    max_connections = 100
    shared_buffers = 128MB
    effective_cache_size = 256MB
    maintenance_work_mem = 32MB
    checkpoint_completion_target = 0.9
    wal_buffers = 4MB
    default_statistics_target = 100
    random_page_cost = 1.1
    effective_io_concurrency = 200
    work_mem = 1310kB
    min_wal_size = 1GB
    max_wal_size = 4GB
    log_destination = 'stderr'
    logging_collector = on
    log_directory = 'log'
    log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
    log_truncate_on_rotation = off
    log_rotation_age = 1d
    log_rotation_size = 100MB
    log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
    log_timezone = 'UTC'
    log_statement = 'all'
    log_duration = on
    log_lock_waits = on
    log_min_duration_statement = 1000

# Service configuration
service:
  type: ClusterIP
  ports:
    postgresql: 5432

# Enable backup
backup:
  enabled: true
  cronjob:
    schedule: "0 2 * * *"  # Daily at 2 AM
    storage:
      size: 10Gi
      storageClass: "standard"
